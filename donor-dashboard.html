<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Dashboard | Zero Waste Food Network</title>

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="donor-dashboard.css">
</head>

<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Donor Dashboard</h1>
                <p id="welcomeUser">Welcome!</p>
            </div>

            <button type="button" onclick="logout()">Logout</button>
        </header>




        <section class="dashboard-summary">
            <h2>My Food Listings</h2>
            <p>Total Listings: <strong id="totalListings">0</strong></p>
        </section>

        <!-- Dashboard Statistics: ADD THIS SECTION -->
        <section class="dashboard-stats">

            <div class="stat-card total">
                <h3>Total Food Listings</h3>
                <p id="totalListingsCount">0</p>
            </div>

            <div class="stat-card pending">
                <h3>Pending Requests</h3>
                <p id="pendingRequestsCount">0</p>
            </div>

            <div class="stat-card approved">
                <h3>Approved Requests</h3>
                <p id="approvedRequestsCount">0</p>
            </div>

            <div class="stat-card rejected">
                <h3>Rejected Requests</h3>
                <p id="rejectedRequestsCount">0</p>
            </div>

        </section>



        <section id="listingsContainer">
            <p id="loadingMessage">Loading your food listings...</p>
        </section>

        <!-- Incoming Food Requests -->
        <section class="dashboard-summary">
            <h2>Incoming Food Requests</h2>
            <p>Review requests from receivers and respond to them.</p>
        </section>

        <section id="requestsContainer">
            <p id="requestsLoading">Loading food requests...</p>
        </section>



        <button type="button" onclick="window.location.href='surplus.html'">
            + Publish New Food
        </button>

    </main>

    <script src="auth.js"></script>

    <script>
        const storedUser = sessionStorage.getItem("user");

        if (!checkLogin("donor")) {
            // checkLogin redirects users who are not authorized.
        } else {
            const user = JSON.parse(storedUser);

            document.getElementById("welcomeUser").textContent =
                "Welcome, " + user.username + "!";



            loadMyListings(user.id);
            loadDonorRequests(user.id);

            // Automatically refresh food listings every 5 seconds
            setInterval(() => {
                loadMyListings(user.id);
            }, 5000);

            // Automatically refresh incoming food requests every 5 seconds
            setInterval(() => {
                loadDonorRequests(user.id);
            }, 5000);
        }







        async function loadMyListings(donorId) {
            const container = document.getElementById("listingsContainer");
            const loadingMessage = document.getElementById("loadingMessage");

            try {
                const response = await fetch("http://localhost:3000/listings");
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error("Could not load food listings.");
                }

                // Show only listings belonging to this donor.
                const myListings = result.listings.filter(
                    listing => Number(listing.donor_id) === Number(donorId)
                );

                document.getElementById("totalListings").textContent =
                    myListings.length;

                document.getElementById("totalListingsCount").textContent =
                    myListings.length;

                // Clear old cards before displaying the latest listings
                container.innerHTML = "";

                if (myListings.length === 0) {
                    container.innerHTML =
                        "<p>You have not published any food listings yet.</p>";
                    return;
                }

                myListings.forEach(listing => {
                    const card = document.createElement("article");
                    card.className = "listing-card";

                    const heading = document.createElement("h3");
                    heading.textContent = listing.food_type;

                    const details = document.createElement("p");
                    details.textContent =
                        "Quantity: " + listing.quantity;

                    const pickup = document.createElement("p");
                    pickup.textContent =
                        "Pickup Address: " + listing.pickup_address;

                    const windowTime = document.createElement("p");
                    windowTime.textContent =
                        "Pickup Window: " + listing.pickup_window;

                    const safeUntil = document.createElement("p");
                    safeUntil.textContent =
                        "Safe Until: " + listing.safe_until;

                    const listingId = document.createElement("p");
                    listingId.textContent =
                        "Listing ID: " + listing.id;

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete Listing";
                    deleteButton.style.backgroundColor = "#dc3545";
                    deleteButton.style.color = "white";
                    deleteButton.style.padding = "8px 12px";
                    deleteButton.style.border = "none";
                    deleteButton.style.borderRadius = "5px";
                    deleteButton.style.cursor = "pointer";

                    deleteButton.addEventListener("click", async () => {
                        const confirmDelete = confirm(
                            "Are you sure you want to delete this food listing?"
                        );

                        if (!confirmDelete) {
                            return;
                        }

                        try {
                            const response = await fetch(
                                `http://localhost:3000/listings/${listing.id}`,
                                {
                                    method: "DELETE",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({
                                        donor_id: donorId
                                    })
                                }
                            );

                            const result = await response.json();

                            if (!response.ok || !result.success) {
                                throw new Error(result.message || "Failed to delete listing.");
                            }

                            alert("Food listing deleted successfully!");
                            loadMyListings(donorId);

                        } catch (error) {
                            console.error("Dashboard error:", error);

                            container.innerHTML =
                                "<p>Could not load listings. Please make sure the server is running.</p>";
                        }
                    });

                    card.append(
                        heading,
                        details,
                        pickup,
                        windowTime,
                        safeUntil,
                        listingId,
                        deleteButton
                    );

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Dashboard error:", error);
                loadingMessage.textContent =
                    "Could not load listings. Please make sure the server is running.";
            }
        }
        // ==========================================
        // LOAD FOOD REQUESTS FOR THIS DONOR
        // ==========================================

        async function loadDonorRequests(donorId) {
            const container = document.getElementById("requestsContainer");

            try {
                const response = await fetch(
                    `http://localhost:3000/donor-requests/${donorId}`
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Could not load food requests."
                    );
                }

                container.innerHTML = "";
                // Update dashboard request statistics
                const pendingCount = result.requests.filter(
                    request => request.status === "Pending"
                ).length;

                const approvedCount = result.requests.filter(
                    request => request.status === "Approved"
                ).length;

                const rejectedCount = result.requests.filter(
                    request => request.status === "Rejected"
                ).length;

                document.getElementById("pendingRequestsCount").textContent = pendingCount;
                document.getElementById("approvedRequestsCount").textContent = approvedCount;
                document.getElementById("rejectedRequestsCount").textContent = rejectedCount;

                if (result.requests.length === 0) {
                    container.innerHTML =
                        "<p>No food requests received yet.</p>";
                    return;
                }

                result.requests.forEach(request => {
                    const card = document.createElement("article");
                    card.className = "listing-card";

                    const heading = document.createElement("h3");
                    heading.textContent = request.food_type;

                    const receiver = document.createElement("p");
                    receiver.textContent =
                        "Requested by: " + request.receiver_name;

                    const quantity = document.createElement("p");
                    quantity.textContent =
                        "Quantity: " + request.quantity;

                    const address = document.createElement("p");
                    address.textContent =
                        "Pickup Address: " + request.pickup_address;

                    const status = document.createElement("p");
                    status.textContent = "Request Status: " + request.status;
                    status.className = "request-status";

                    card.append(heading, receiver, quantity, address, status);

                    // Show action buttons only for pending requests
                    if (request.status === "Pending") {
                        const approveButton = document.createElement("button");
                        approveButton.textContent = "Approve";
                        approveButton.className = "approve-btn";

                        approveButton.addEventListener("click", () => {
                            updateRequestStatus(request.request_id, donorId, "Approved");
                        });

                        const rejectButton = document.createElement("button");
                        rejectButton.textContent = "Reject";
                        rejectButton.className = "reject-btn";

                        rejectButton.addEventListener("click", () => {
                            updateRequestStatus(request.request_id, donorId, "Rejected");
                        });

                        card.append(approveButton, rejectButton);
                    }

                    container.appendChild(card);


                });

            } catch (error) {
                console.error("Food requests error:", error);

                container.innerHTML =
                    "<p>Could not load food requests. Please check the server.</p>";
            }
        }

        async function updateRequestStatus(requestId, donorId, status) {
            const confirmed = confirm(
                `Are you sure you want to ${status.toLowerCase()} this food request?`
            );

            if (!confirmed) return;

            try {
                console.log("Request ID:", requestId);
                console.log("Status:", status);
                console.log("Donor ID:", donorId);
                const response = await fetch(
                    `http://localhost:3000/food-requests/${requestId}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            status: status,
                            donor_id: donorId
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Could not update request.");
                }

                alert(result.message);

                // Reload requests to display the updated status
                await loadDonorRequests(donorId);

            } catch (error) {
                console.error("Update request error:", error);
                alert(error.message || "Could not update request. Please check the server.");
            }
        }


    </script>

</body>

</html>
